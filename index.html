<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 작명</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">

<!-- 로드 순서 중요: manseryok → saju-engine → db_saju → db_hanja → jawon_ohaeng_db -->
<script src="manseryok.js"></script>
<script src="saju-engine.js"></script>
<script src="db_saju.js"></script>
<script src="db_hanja.js"></script>
<script src="jawon_ohaeng_db.js"></script>

<style>
:root{
  --bg:#0d0d0f;--sur:#13141a;--sur2:#1a1c24;--bdr:#252830;
  --txt:#e8e4dc;--mut:#7a7680;--dim:#4a4852;
  --gold:#c9a84c;--goldl:#e2c47a;--goldd:#7a6230;
  --木:#4aab6d;--火:#e05a3a;--土:#c8893c;--金:#9aafcc;--水:#5b9fd4;
  --great:#c9a84c;--good:#4aab6d;--neu:#9aafcc;--bad:#e05a3a;--terrible:#c02020;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 50%,rgba(201,168,76,.04),transparent 50%),radial-gradient(circle at 80% 20%,rgba(91,159,212,.04),transparent 50%);pointer-events:none;z-index:0}
.w{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 20px}

/* 헤더 */
header{padding:54px 0 34px;text-align:center;border-bottom:1px solid var(--bdr);position:relative}
header::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.badge{font-size:10px;letter-spacing:3px;color:var(--gold);border:1px solid var(--goldd);padding:4px 12px;display:inline-block;margin-bottom:12px}
h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(24px,5vw,44px);letter-spacing:-1px}
h1 em{color:var(--gold);font-style:normal}
.sub{margin-top:9px;color:var(--mut);font-size:12px;letter-spacing:.5px}

/* 단계 */
.steps{display:flex;align-items:center;justify-content:center;padding:26px 0}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);transition:color .3s}
.st.active{color:var(--gold)}.st.done{color:var(--mut)}
.sn{width:21px;height:21px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.st.active .sn{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.st.done .sn{background:var(--mut);border-color:var(--mut);color:var(--bg)}
.sl{width:32px;height:1px;background:var(--bdr);margin:0 4px}
@media(max-width:460px){.st span:not(.sn){display:none}.sl{width:18px}}

/* 카드 */
.card{background:var(--sur);border:1px solid var(--bdr);padding:26px;margin-bottom:16px;animation:fu .35s ease both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.ct{font-family:'Noto Serif KR',serif;font-size:11px;letter-spacing:3px;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:9px}
.ct::after{content:'';flex:1;height:1px;background:var(--bdr)}

/* 폼 */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.fi{display:flex;flex-direction:column;gap:6px}
.fi.full{grid-column:1/-1}
label{font-size:10px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
.ln{font-size:9px;color:var(--dim);letter-spacing:.3px;text-transform:none;margin-left:3px}
input,select{background:var(--bg);border:1px solid var(--bdr);color:var(--txt);padding:10px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s;-webkit-appearance:none;width:100%}
input:focus,select:focus{border-color:var(--goldd)}
input::placeholder{color:var(--dim)}
select option{background:var(--sur2)}
.r2{display:flex;gap:6px}
.tb{flex:1;padding:9px 5px;background:var(--bg);border:1px solid var(--bdr);color:var(--mut);cursor:pointer;font-size:12px;font-family:'Noto Sans KR',sans-serif;transition:all .2s;text-align:center}
.tb.on{background:var(--sur2);border-color:var(--goldd);color:var(--gold)}

/* 성씨 AC */
.acw{position:relative}
.acl{position:absolute;top:100%;left:0;right:0;background:var(--sur2);border:1px solid var(--goldd);z-index:50;display:none;max-height:180px;overflow-y:auto}
.aci{padding:8px 12px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;transition:background .15s}
.aci:hover{background:rgba(201,168,76,.1)}
.acs{font-size:10px;color:var(--gold)}
.sh{font-size:10px;color:var(--gold);min-height:13px;margin-top:2px}

/* 지지 시각 */
.hg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:9px}
@media(max-width:500px){.hg{grid-template-columns:repeat(4,1fr)}}
.hb{background:var(--bg);border:1px solid var(--bdr);color:var(--mut);padding:7px 2px;text-align:center;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;line-height:1.3}
.hb:hover{border-color:var(--goldd);color:var(--txt)}
.hb.on{background:rgba(201,168,76,.07);border-color:var(--gold);color:var(--gold)}
.hbj{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:600;display:block}
.hbh{font-size:9px;color:var(--goldd);display:block}
.hbt{font-size:8px;color:var(--dim);display:block;margin-top:1px}
.hb.on .hbh{color:var(--gold)}
.hb.none-b{grid-column:span 2;font-size:11px}
.hr{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hr input{width:68px}
#hlbl{font-size:11px;color:var(--gold)}

/* 버튼 */
.bmain{display:block;width:100%;padding:14px;background:transparent;border:1px solid var(--goldd);color:var(--gold);font-size:12px;font-family:'Noto Serif KR',serif;letter-spacing:4px;cursor:pointer;transition:all .3s;margin-top:20px;position:relative;overflow:hidden}
.bmain::before{content:'';position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:0}
.bmain:hover::before{transform:scaleX(1)}
.bmain:hover{color:var(--bg)}
.bmain span{position:relative;z-index:1}
.breset{background:transparent;border:1px solid var(--bdr);color:var(--mut);padding:8px 16px;font-size:11px;font-family:'Noto Sans KR',sans-serif;letter-spacing:1.5px;cursor:pointer;transition:all .2s}
.breset:hover{border-color:var(--mut);color:var(--txt)}

/* 사주 원국표 */
.pt{width:100%;border-collapse:collapse;text-align:center;font-family:'Noto Serif KR',serif;margin-bottom:18px}
.pt th{padding:8px 5px;font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:400;border-bottom:1px solid var(--bdr)}
.pt td{padding:8px 5px;border-bottom:1px solid var(--bdr)}
.pt .row-lbl{font-size:10px;color:var(--dim);letter-spacing:1px;text-align:left;padding-left:4px;white-space:nowrap}
.pb{font-size:26px;font-weight:600;line-height:1;display:block}
.ps{font-size:10px;color:var(--mut);display:block;margin-top:3px}
.ss-tag{display:inline-block;font-size:10px;padding:2px 7px;border:1px solid currentColor;letter-spacing:.5px;margin-bottom:2px;border-radius:2px}
.ss-sub{font-size:9px;color:var(--dim);display:block}
.pt .col-il{background:rgba(201,168,76,.05)}

/* 오행 분포 */
.od{display:flex;flex-direction:column;gap:8px}
.or{display:flex;align-items:center;gap:10px}
.ol{font-size:11px;width:44px;flex-shrink:0;font-family:'Noto Serif KR',serif}
.obg{flex:1;height:5px;background:var(--bdr);overflow:hidden}
.obf{height:100%;transition:width .6s ease}
.oc{font-size:11px;color:var(--mut);width:16px;text-align:right;flex-shrink:0}

/* 용신 */
.ysbox{display:flex;align-items:center;gap:13px;padding:16px;background:var(--bg);border:1px solid var(--bdr);margin-top:16px}
.ysc{font-family:'Noto Serif KR',serif;font-size:36px;font-weight:900;line-height:1;flex-shrink:0}
.yst{font-size:9px;letter-spacing:3px;color:var(--mut);margin-bottom:3px}
.ysn{font-size:15px;font-family:'Noto Serif KR',serif;margin-bottom:4px}
.ysd{font-size:11px;color:var(--mut);line-height:1.6}
.ys-reason{margin-top:6px;padding:5px 8px;background:rgba(255,180,0,.10);border-left:3px solid #f0a500;border-radius:3px;color:#b07800;font-size:10.5px;line-height:1.5}
.lunar-w{margin-top:9px;padding:8px 12px;background:rgba(201,168,76,.06);border:1px solid var(--goldd);font-size:10px;color:var(--goldd);line-height:1.6}

/* 용신 풀이 */
.ys-explain{margin-top:12px;padding:16px;background:var(--sur2);border:1px solid var(--bdr);border-top:2px solid var(--goldd)}
.ys-explain-title{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ys-explain-title::after{content:'';flex:1;height:1px;background:var(--bdr)}
.ys-explain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ys-explain-item{background:var(--bg);border:1px solid var(--bdr);padding:12px}
.ys-explain-item-label{font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-bottom:5px}
.ys-explain-item-val{font-size:13px;font-family:'Noto Serif KR',serif;font-weight:600;margin-bottom:6px}
.ys-explain-item-desc{font-size:10.5px;color:var(--mut);line-height:1.65}
.ys-explain-summary{margin-top:10px;padding:10px 13px;background:rgba(201,168,76,.06);border-left:3px solid var(--goldd);font-size:11px;color:var(--txt);line-height:1.8}

/* 이름 목록 */
.rh{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.fr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fb{padding:5px 12px;background:var(--bg);border:1px solid var(--bdr);color:var(--mut);font-size:10px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .2s;letter-spacing:1px}
.fb.on{border-color:var(--goldd);color:var(--gold);background:rgba(201,168,76,.05)}
.si{font-size:10px;color:var(--dim);letter-spacing:.5px;margin-bottom:12px}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.nc{background:var(--bg);border:1px solid var(--bdr);padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.nc:hover{border-color:var(--goldd);transform:translateY(-2px)}
.nc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--gold);transform:scaleY(0);transform-origin:bottom;transition:transform .2s}
.nc:hover::before{transform:scaleY(1)}
.nk{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:2px;display:flex;align-items:baseline;gap:6px}
.nh{font-size:12px;color:var(--mut);font-weight:300}
.nfull{font-size:10px;color:var(--dim);margin-bottom:7px}
.nbs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.ob{display:inline-flex;padding:2px 6px;font-size:9px;font-weight:500;border:1px solid currentColor;letter-spacing:.5px}
.ob-木{color:var(--木);border-color:rgba(74,171,109,.4);background:rgba(74,171,109,.07)}
.ob-火{color:var(--火);border-color:rgba(224,90,58,.4);background:rgba(224,90,58,.07)}
.ob-土{color:var(--土);border-color:rgba(200,137,60,.4);background:rgba(200,137,60,.07)}
.ob-金{color:var(--金);border-color:rgba(154,175,204,.4);background:rgba(154,175,204,.07)}
.ob-水{color:var(--水);border-color:rgba(91,159,212,.4);background:rgba(91,159,212,.07)}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:9px}
.sc{background:var(--sur2);padding:5px 2px;text-align:center}
.scl{font-size:8px;color:var(--dim);display:block}
.scn{font-size:14px;font-family:'Noto Serif KR',serif;display:block}
.sck{font-size:8px;display:block}
.lg-great{color:var(--great)}.lg-good{color:var(--good)}.lg-neutral{color:var(--neu)}.lg-bad{color:var(--bad)}.lg-terrible{color:var(--terrible)}

/* 로딩/빈상태 */
.ld{text-align:center;padding:55px 20px;color:var(--mut)}
.sp{width:36px;height:36px;border:2px solid var(--bdr);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 13px}
@keyframes sp{to{transform:rotate(360deg)}}
.emp{text-align:center;padding:55px 20px;color:var(--mut)}
.emc{font-family:'Noto Serif KR',serif;font-size:52px;opacity:.1;display:block;margin-bottom:12px}

/* 모달 */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:flex-end;padding:14px;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border:1px solid var(--bdr);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhd{padding:20px 24px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between}
.mnb{font-family:'Noto Serif KR',serif;font-size:36px;font-weight:900;letter-spacing:4px}
.mhb{font-size:16px;color:var(--mut);letter-spacing:3px;margin-top:2px;font-family:'Noto Serif KR',serif}
.mcl{background:none;border:1px solid var(--bdr);color:var(--mut);width:28px;height:28px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.mcl:hover{border-color:var(--mut);color:var(--txt)}
.mb{padding:20px 24px}
.ms{margin-bottom:20px}
.mst{font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:9px;text-transform:uppercase}
.hjg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hji{background:var(--bg);border:1px solid var(--bdr);padding:12px;display:flex;gap:10px;align-items:flex-start}
.hjb{font-size:28px;font-family:'Noto Serif KR',serif;flex-shrink:0}
.hji-t{font-size:11px;color:var(--mut);line-height:1.65}
.hji-t strong{color:var(--txt);font-weight:500}
.sgg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgi{background:var(--bg);border:1px solid var(--bdr);padding:12px}
.sgl{font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-bottom:4px}
.sgn{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:600}
.sgm{font-size:10px;color:var(--mut);margin-top:4px;line-height:1.5}
.ef{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.efe{font-size:10px;padding:2px 6px;border:1px solid currentColor;display:inline-block}
.efa{color:var(--dim);font-size:10px}
.efd{font-size:10px;color:var(--mut);margin:2px 0;line-height:1.5}

/* 토글 */
.hide{display:none}.show{display:block;animation:fu .3s ease}
</style>
</head>
<body>
<div class="w">

<header>
  <div class="badge">사주작명 · 오행이름</div>
  <h1>사주(四柱)로 짓는 <em>좋은 이름</em></h1>
  <p class="sub">만세력 정밀 계산 → 용신 도출 → 수리오행 4격 검증</p>
</header>

<div class="steps">
  <div class="st active" id="s1"><span class="sn">1</span><span>정보입력</span></div>
  <div class="sl"></div>
  <div class="st" id="s2"><span class="sn">2</span><span>사주분석</span></div>
  <div class="sl"></div>
  <div class="st" id="s3"><span class="sn">3</span><span>이름추천</span></div>
</div>

<!-- 입력 -->
<div id="sInput" class="show">
<div class="card">
<div class="ct">생년월일시 입력</div>
<div class="fg">

  <div class="fi acw">
    <label>성씨 (한글)</label>
    <input type="text" id="iS" placeholder="김, 이, 박…" maxlength="2" autocomplete="off"
           oninput="onSI()" onblur="hideAC()">
    <div class="acl" id="acl"></div>
  </div>

  <div class="fi">
    <label>성씨 한자 획수<span class="ln">漢字 기준</span></label>
    <input type="number" id="iStr" min="1" max="40" placeholder="金→8  李→7  朴→6">
    <div class="sh" id="shint"></div>
  </div>

  <div class="fi">
    <label>성별</label>
    <div class="r2">
      <button class="tb on" id="gM" onclick="setG('M')">男 남자</button>
      <button class="tb"    id="gF" onclick="setG('F')">女 여자</button>
    </div>
  </div>

  <div class="fi">
    <label>양력 / 음력</label>
    <div class="r2">
      <button class="tb on" id="cS" onclick="setC('solar')">☀ 양력</button>
      <button class="tb"    id="cL" onclick="setC('lunar')">☾ 음력</button>
    </div>
  </div>

  <div class="fi" id="lpG" style="display:none">
    <label>윤달</label>
    <div class="r2">
      <button class="tb on" id="lpN" onclick="setL(false)">일반달</button>
      <button class="tb"    id="lpY" onclick="setL(true)">윤달</button>
    </div>
  </div>

  <div class="fi">
    <label>출생 연도</label>
    <input type="number" id="iY" placeholder="예: 1990" min="1930" max="2040">
  </div>

  <div class="fi">
    <label>출생 월</label>
    <select id="iM">
      <option value="">월 선택</option>
      <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
      <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
      <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
      <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
    </select>
  </div>

  <div class="fi">
    <label>출생 일</label>
    <input type="number" id="iD" placeholder="예: 15" min="1" max="31">
  </div>

  <div class="fi full">
    <label>출생 시각 — 지지(地支) 기준<span class="ln">모르면 '모름' 선택</span></label>
    <div class="hg" id="hg"></div>
    <input type="hidden" id="iHR"><span id="hlbl" style="display:none"></span>
  </div>

</div>
<button class="bmain" onclick="run()"><span>✦ 사주 분석 · 이름 추천받기</span></button>
</div>
</div>

<!-- 사주 분석 -->
<div id="sSaju" class="hide">
  <div class="card"><div class="ct">사주원국 (四柱原局)</div><div id="oSaju"></div></div>
  <div class="card"><div class="ct">오행 분포 · 용신 (用神)</div><div id="oOheng"></div></div>
</div>

<!-- 이름 추천 -->
<div id="sName" class="hide">
  <div class="card">
    <div class="rh">
      <div class="ct" style="margin-bottom:0">추천 이름</div>
      <button class="breset" onclick="resetAll()">← 다시 입력</button>
    </div>
    <div class="fr" id="fr"></div>
    <div class="si" id="si"></div>
    <div id="oName"></div>
  </div>
</div>

</div><!-- /w -->

<!-- 모달 -->
<div class="mbg hide" id="mbg" onclick="closeMbg(event)">
  <div class="modal">
    <div class="mhd">
      <div>
        <div class="mnb" id="mdN"></div>
        <div class="mhb" id="mdH"></div>
      </div>
      <button class="mcl" onclick="closeMd()">✕</button>
    </div>
    <div class="mb" id="mdB"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// 전역 상태
// ════════════════════════════════════════════════

// ── 성씨 자동완성 ──
function onSI() {
  const v = document.getElementById('iS').value.trim();
  const ac = document.getElementById('acl');
  if (!v) { ac.style.display='none'; return; }
  const ms = SDB.filter(s => s.k.startsWith(v));
  if (!ms.length) { ac.style.display='none'; return; }
  ac.innerHTML = ms.slice(0,8).map(s =>
    `<div class="aci" onmousedown="pickS('${s.k}','${s.h}',${s.s})">
      <span>${s.k}(${s.h})</span><span class="acs">${s.s}획</span>
    </div>`).join('');
  ac.style.display = 'block';
  if (ms.length === 1) { document.getElementById('iStr').value=ms[0].s; document.getElementById('shint').textContent=`${ms[0].k}(${ms[0].h}) ${ms[0].s}획 자동입력`; }
}
function hideAC() { setTimeout(() => document.getElementById('acl').style.display='none', 170); }
function pickS(k,h,s) {
  document.getElementById('iS').value=k;
  document.getElementById('iStr').value=s;
  document.getElementById('acl').style.display='none';
  document.getElementById('shint').textContent=`${k}(${h}) — 한자 ${s}획`;
}

// ── 지지 시각 그리드 ──
function buildHG() {
  const g = document.getElementById('hg');
  let h = `<button class="hb none-b on" id="hbN" onclick="pickH(null)">
    <span class="hbj" style="font-size:11px">모름</span><span class="hbt">시각 불명</span>
  </button>`;
  JH.forEach((jh,i) => h += `<button class="hb" id="hb${i}" onclick="pickH(${jh.v[0]})">
    <span class="hbj">${jh.j}시</span><span class="hbh">${jh.hj}</span><span class="hbt">${jh.r}</span>
  </button>`);
  g.innerHTML = h;
}
function pickH(v) {
  G.hour = v;
  document.getElementById('hbN').classList.toggle('on', v===null);
  JH.forEach((jh,i) => document.getElementById('hb'+i).classList.toggle('on', v!==null && jh.v.includes(v)));
  document.getElementById('iHR').value = v===null ? '' : v;
  updHL(v);
}
function syncHR(v) {
  const n = parseInt(v);
  if (isNaN(n)||n<0||n>23) { G.hour=null; updHL(null); return; }
  G.hour = n;
  document.getElementById('hbN').classList.remove('on');
  JH.forEach((jh,i) => document.getElementById('hb'+i).classList.toggle('on', jh.v.includes(n)));
  updHL(n);
}
function updHL(h) {
  const el = document.getElementById('hlbl');
  if (h===null||h===undefined) { el.textContent='—'; return; }
  const info = JH.find(jh => jh.v.includes(h) || (h===23 && jh.j==='자'));
  el.textContent = info ? `${info.j}시(${info.hj}) · ${info.r}` : '—';
}

/**
 * 음력 → 양력 정밀 변환 (한국천문연구원 기준 검증 완료)
 * @param {number} ly    음력 연도
 * @param {number} lm    음력 월 (1~12)
 * @param {number} ld    음력 일 (1~30)
 * @param {boolean} leap 윤달 여부
 * @returns {{y,m,d}} 양력 날짜
 */
function lunarApprox(ly, lm, ld, leap) {
  const data = LUNAR_DATA[ly];
  if (!data) {
    const off=[21,20,18,17,17,15,15,14,14,14,14,14];
    const dt = new Date(ly, lm-1, ld+(off[lm-1]||20));
    return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate()};
  }

  const [solY, solM, solD, monthBig, leapMonth] = data;

  // 윤달 날수: LEAP_BIG 테이블 사용
  const LEAP_BIG = {1930:0,1931:0,1932:0,1933:1,1934:0,1935:0,1936:1,1937:0,1938:1,1939:0,1940:0,1941:1,1942:0,1943:0,1944:1,1945:0,1946:0,1947:0,1948:0,1949:0,1950:0,1951:0,1952:1,1953:0,1954:0,1955:1,1956:0,1957:0,1958:0,1959:0,1960:0,1961:0,1962:0,1963:0,1964:0,1965:0,1966:0,1967:0,1968:0,1969:0,1970:0,1971:0,1972:0,1973:0,1974:0,1975:0,1976:0,1977:0,1978:0,1979:1,1980:0,1981:0,1982:0,1983:0,1984:0,1985:0,1986:0,1987:0,1988:0,1989:0,1990:0,1991:0,1992:0,1993:0,1994:0,1995:0,1996:0,1997:0,1998:0,1999:0,2000:0,2001:0,2002:0,2003:0,2004:0,2005:0,2006:0,2007:0,2008:0,2009:0,2010:0,2011:0,2012:1,2013:0,2014:0,2015:0,2016:0,2017:0,2018:0,2019:0,2020:0,2021:0,2022:0,2023:0,2024:0,2025:0,2026:0,2027:0,2028:0,2029:0,2030:0,2031:0,2032:0,2033:0,2034:0,2035:0,2036:1,2037:0,2038:0,2039:0,2040:0};
  const leapBig = LEAP_BIG[ly] || 0;

  let base = new Date(solY, solM-1, solD);

  // 1월부터 목표 월 이전까지 날수 누적
  for (let i = 1; i < lm; i++) {
    base = new Date(base.getTime() + (monthBig[i-1] ? 30 : 29) * 86400000);
    // 윤달이 이 달 뒤에 오면 윤달 날수도 누적 (윤달 당사자가 아닐 때)
    if (leapMonth === i && !leap) {
      base = new Date(base.getTime() + (leapBig ? 30 : 29) * 86400000);
    }
  }

  // 윤달 본인인 경우: 본달 통과 후 윤달 시작일로
  if (leap && leapMonth === lm) {
    base = new Date(base.getTime() + (monthBig[lm-1] ? 30 : 29) * 86400000);
  }

  base = new Date(base.getTime() + (ld - 1) * 86400000);
  return { y: base.getFullYear(), m: base.getMonth()+1, d: base.getDate() };
}

// 메인 실행
// ════════════════════════════════════════════════
function run() {
  const sung    = document.getElementById('iS').value.trim();
  const strokes = parseInt(document.getElementById('iStr').value);
  const year    = parseInt(document.getElementById('iY').value);
  const month   = parseInt(document.getElementById('iM').value);
  const day     = parseInt(document.getElementById('iD').value);

  if (!sung)               return alert('성씨를 입력해주세요.');
  if (!strokes||strokes<1) return alert('성씨 한자 획수를 입력해주세요.\n예: 金→8, 李→7, 朴→6');
  if (!year||year<1900)    return alert('출생 연도를 입력해주세요.');
  if (!month)              return alert('출생 월을 선택해주세요.');
  if (!day||day<1||day>31) return alert('출생 일을 입력해주세요.');

  let fy=year, fm=month, fd=day, lunarMsg='';
  if (G.cal==='lunar') {
    const c = lunarApprox(year, month, day, G.leap);
    fy=c.y; fm=c.m; fd=c.d;
    lunarMsg = `※ 음력 ${year}.${month}.${day}${G.leap?'(윤)':''} → 양력 약 ${fy}.${fm}.${fd} 변환 (정밀도는 만세력으로 확인 권장)`;
  }

  const hourArg = (G.hour === null || G.hour === undefined) ? -1 : G.hour;

  // ── SajuEngine.analyze (내부에서 Manseryok 사용) ──
  const ana = SajuEngine.analyze(fy, fm, fd, hourArg);
  // ana = { yeonju, wolju, ilju, siju, pillars, dist, yongsin, shingang, geokguk, ... }
  // ana.yongsin = { yongsin:[{oh:'목',ss:'...'}, ...], heesin:[...], gisin:[...] }
  // ana.dist    = {목:N, 화:N, 토:N, 금:N, 수:N}

  // 용신: 첫 번째 항목 사용 (방어 코드: saju-engine 구조 불일치 대비)
  const yongsinList = ana?.yongsin?.yongsin;
  if (!yongsinList || !yongsinList.length) {
    return alert('사주 분석 오류: 용신 데이터를 가져올 수 없습니다.\nsaju-engine.js 파일을 확인해주세요.');
  }
  const yongsinOh = yongsinList[0].oh;   // '목'|'화'|'토'|'금'|'수'
  const yongsinJW = OHJ[yongsinOh];               // '木'|'火'|'土'|'金'|'水'

  // pillars 구조를 renderSaju가 기대하는 형태로 변환
  const pillars = { yeonju: ana.yeonju, wolju: ana.wolju, ilju: ana.ilju, siju: ana.siju };

  renderSaju(pillars, ana.dist, yongsinOh, yongsinJW, ana, lunarMsg);
  genNames(sung, strokes, yongsinJW, ana);

  // ── 진단 로그 (F12 콘솔에서 확인) ──
  console.log('=== 사주 진단 ===');
  console.log('입력:', fy+'.'+fm+'.'+fd, '시각:'+hourArg);
  console.log('연주:', ana.yeonju.ganHJ+ana.yeonju.jiHJ, '('+ana.yeonju.gan+ana.yeonju.ji+')');
  console.log('월주:', ana.wolju.ganHJ+ana.wolju.jiHJ, '('+ana.wolju.gan+ana.wolju.ji+')');
  console.log('일주:', ana.ilju.ganHJ+ana.ilju.jiHJ, '('+ana.ilju.gan+ana.ilju.ji+')');
  console.log('시주:', ana.siju ? ana.siju.ganHJ+ana.siju.jiHJ+'('+ana.siju.gan+ana.siju.ji+')' : '없음');
  console.log('오행분포:', JSON.stringify(ana.dist));
  console.log('격국:', ana.geokguk, '/ 신강약:', ana.shingang.type);
  console.log('용신:', ana.yongsin.yongsin.map(v=>v.oh).join(', '), '→ 한자:', yongsinJW);

  setStep(2);
  show('sInput','hide'); show('sSaju','show'); show('sName','show');
  setTimeout(()=>document.getElementById('sSaju').scrollIntoView({behavior:'smooth'}), 80);
}

function show(id, cls) { document.getElementById(id).className = cls; }

// ── 사주 원국 렌더 ──
function renderSaju(pillars, dist, yongsinOh, yongsinJW, ana, lunarMsg) {

  // ━━ 열 순서: 시·일·월·연 (한국 전통 만세력 표준, 오른쪽이 연주) ━━
  // 시주가 없으면 3열(일·월·연)로 표시
  const hasSi = !!pillars.siju;
  // [시, 일, 월, 연] 순
  const colDefs = [
    { key:'siju',   lbl:'시주(時柱)', p: pillars.siju   },
    { key:'ilju',   lbl:'일주(日柱)', p: pillars.ilju   },
    { key:'wolju',  lbl:'월주(月柱)', p: pillars.wolju  },
    { key:'yeonju', lbl:'연주(年柱)', p: pillars.yeonju },
  ].filter(c => !!c.p);

  const ilIdx = ana.ilju.stemIdx;  // 일간 인덱스 (십신 기준)

  // 십신 색상 매핑
  const SS_COLOR = {
    비견:'var(--木)', 겁재:'var(--木)',
    식신:'var(--火)', 상관:'var(--火)',
    편재:'var(--土)', 정재:'var(--土)',
    편관:'var(--金)', 정관:'var(--金)',
    편인:'var(--水)', 정인:'var(--水)',
  };

  // 십성 계산 헬퍼 (saju-engine의 함수 활용)
  function stemSS(stemIdx) {
    return SajuEngine.getStemSipseong(ilIdx, stemIdx);
  }
  function branchSS(branchIdx) {
    return SajuEngine.getBranchSipseong(ilIdx, branchIdx);
  }

  // ━━ 원국표 ━━
  // 행 구성: 십신(천간) / 천간 / 십신(지지) / 지지
  // 일주 열은 황금 배경 강조

  let t = `<table class="pt">`;

  // 헤더행 (시·일·월·연)
  t += `<tr><th class="row-lbl"></th>`;
  colDefs.forEach(c => {
    const isIl = c.key === 'ilju';
    t += `<th${isIl?' style="color:var(--gold)"':''}>${c.lbl}</th>`;
  });
  t += `</tr>`;

  // ① 천간 십신
  t += `<tr><td class="row-lbl">십신</td>`;
  colDefs.forEach(c => {
    const isIl = c.key === 'ilju';
    if (isIl) {
      // 일간은 십신 없음 — 일원(日元) 표기
      t += `<td class="col-il"><span class="ss-tag" style="color:var(--gold);border-color:var(--goldd)">일원(日元)</span></td>`;
    } else {
      const ss  = stemSS(c.p.stemIdx);
      const col = SS_COLOR[ss] || 'var(--mut)';
      t += `<td><span class="ss-tag" style="color:${col};border-color:${col}">${ss}</span></td>`;
    }
  });
  t += `</tr>`;

  // ② 천간
  t += `<tr><td class="row-lbl">천간</td>`;
  colDefs.forEach(c => {
    const isIl = c.key === 'ilju';
    const oh   = SajuEngine.CHEONGAN_OHENG[c.p.gan];
    const col  = OHC[oh];
    t += `<td${isIl?' class="col-il"':''}>`
       + `<span class="pb" style="color:${col}">${c.p.ganHJ}</span>`
       + `<span class="ps">${c.p.gan} · ${oh}(${OHJ[oh]})</span>`
       + `</td>`;
  });
  t += `</tr>`;

  // ③ 지지 십신
  t += `<tr><td class="row-lbl">십신</td>`;
  colDefs.forEach(c => {
    const isIl = c.key === 'ilju';
    const ss   = branchSS(c.p.branchIdx);
    const col  = SS_COLOR[ss] || 'var(--mut)';
    t += `<td${isIl?' class="col-il"':''}>`
       + `<span class="ss-tag" style="color:${col};border-color:${col}">${ss}</span>`
       + `</td>`;
  });
  t += `</tr>`;

  // ④ 지지
  t += `<tr><td class="row-lbl">지지</td>`;
  colDefs.forEach(c => {
    const isIl = c.key === 'ilju';
    const oh   = SajuEngine.JIJI_OHENG[c.p.ji];
    const col  = OHC[oh];
    t += `<td${isIl?' class="col-il"':''}>`
       + `<span class="pb" style="color:${col}">${c.p.jiHJ}</span>`
       + `<span class="ps">${c.p.ji} · ${oh}(${OHJ[oh]})</span>`
       + `</td>`;
  });
  t += `</tr>`;

  t += `</table>`;

  if (lunarMsg) t += `<div class="lunar-w">${lunarMsg}</div>`;
  document.getElementById('oSaju').innerHTML = t;

  // ━━ 오행 분포 + 용신 ━━
  const total = Object.values(dist).reduce((a,b)=>a+b,0);
  let d = '<div class="od">';
  ['목','화','토','금','수'].forEach(oh => {
    const n   = dist[oh]||0;
    const pct = total ? (n/total*100).toFixed(0) : 0;
    const jw  = OHJ[oh], col = OHC[oh];
    d += `<div class="or">
      <span class="ol" style="color:${col}">${jw}(${oh})</span>
      <div class="obg"><div class="obf" style="width:${pct}%;background:${col}"></div></div>
      <span class="oc">${n}</span>
    </div>`;
  });
  d += '</div>';

  const ysCol  = OHC[yongsinOh];
  const ysInfo = ana.yongsin.yongsin.map(v=>`${v.oh}(${OHJ[v.oh]}) — ${v.ss}`).join(', ');
  const heesinInfo = ana.yongsin.heesin?.map(v=>`${v.oh}(${OHJ[v.oh]})`).join(', ') || '';
  const gisinInfo  = ana.yongsin.gisin?.map(v=>`${v.oh}(${OHJ[v.oh]})`).join(', ')  || '';
  const reasonHtml = ana.yongsin.reason
    ? `<div class="ys-reason">⚠️ ${ana.yongsin.reason}</div>`
    : '';

  d += `<div class="ysbox">
    <div class="ysc" style="color:${ysCol}">${yongsinJW}</div>
    <div style="flex:1">
      <div class="yst">用神 · 용신</div>
      <div class="ysn" style="color:${ysCol}">${ysInfo}</div>
      <div class="ysd">
        신강약: <strong>${ana.shingang.level==='strong'?'신강(身强)':ana.shingang.level==='weak'?'신약(身弱)':'중화(中和)'}</strong>
        &nbsp;·&nbsp; 격국: <strong>${ana.geokguk}</strong><br>
        ${heesinInfo ? `희신: <span style="color:var(--mut)">${heesinInfo}</span> &nbsp;·&nbsp; ` : ''}
        ${gisinInfo  ? `기신: <span style="color:var(--bad)">${gisinInfo}</span><br>` : ''}
        이름에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 보충하여 사주 균형을 맞춥니다.
        ${reasonHtml}
      </div>
    </div>
  </div>`;

  // ━━ 용신 풀이 ━━
  const shinglevel = ana.shingang.level;
  const shingStr   = shinglevel==='strong'?'신강(身强)':shinglevel==='weak'?'신약(身弱)':'중화(中和)';
  // ── 신강약 근거 문장 동적 생성 ──
  // sipseong.detail에서 비겁·인성이 어느 자리에 있는지 추출
  const shingDesc = (() => {
    const sp = ana.sipseong;
    if (!sp) return shingStr + '입니다.';

    const supportStars = ['비견','겁재','편인','정인'];
    const weakenStars  = ['식신','상관','편재','정재','편관','정관'];

    // 각 십성이 차지한 자리 목록 수집
    const supportPositions = [];
    const weakenPositions  = [];
    supportStars.forEach(s => {
      (sp.detail[s] || []).forEach(d => supportPositions.push({ star: s, pos: d.pos, weight: d.weight }));
    });
    weakenStars.forEach(s => {
      (sp.detail[s] || []).forEach(d => weakenPositions.push({ star: s, pos: d.pos, weight: d.weight }));
    });

    // 월지 여부 — 월지는 weight 40으로 가장 영향력이 큼
    const supportScore = supportStars.reduce((s,k) => s + (sp.score[k]||0), 0);
    const weakenScore  = weakenStars.reduce((s,k)  => s + (sp.score[k]||0), 0);

    // 주요 자리 설명 (weight 높은 순으로 최대 3개)
    function topPositions(list) {
      return [...list]
        .sort((a,b) => b.weight - a.weight)
        .slice(0, 3)
        .map(d => `${d.pos}의 ${d.star}`)
        .join(', ');
    }

    // 월지가 비겁/인성인지 관성/재성인지
    const woljiSupportEntry = supportPositions.find(d => d.pos === '월지(핵심)');
    const woljiWeakenEntry  = weakenPositions.find(d => d.pos === '월지(핵심)');

    // 신강 판단 기준: supportScore >= 55 → 신강, <= 30 → 신약 (saju-engine 기준값)
    const ilganOhDesc = SajuEngine.CHEONGAN_OHENG[ana.ilju.gan];
    const ilganJWDesc = OHJ[ilganOhDesc] || '';
    // 식상(일간이 생하는 오행), 인성(일간을 생하는 오행)
    const GENERATE_OH = { 목:'화', 화:'토', 토:'금', 금:'수', 수:'목' };
    const GENERATED_BY = { 화:'목', 토:'화', 금:'토', 수:'금', 목:'수' };
    const sikSangOh  = GENERATE_OH[ilganOhDesc];   // 식상 오행
    const inSeongOh  = GENERATED_BY[ilganOhDesc];  // 인성 오행
    const sikSangJW  = OHJ[sikSangOh]  || '';
    const inSeongJW  = OHJ[inSeongOh]  || '';

    if (shinglevel === 'strong') {
      const tops = topPositions(supportPositions);
      const woljiNote = woljiSupportEntry
        ? `특히 사주의 중심축인 <strong>월지에 ${woljiSupportEntry.star}</strong>이 자리하여 일간의 뿌리가 단단합니다.`
        : woljiWeakenEntry
        ? `월지에는 <strong>${woljiWeakenEntry.star}</strong>이 있어 일간을 소모시키지만, 다른 자리의 비겁·인성이 이를 상쇄합니다.`
        : '';
      return `비겁·인성 점수 <strong>${supportScore}점</strong>으로 신강 기준(55점)을 넘습니다.`
        + (tops ? ` ${tops}이 일간을 받쳐줍니다.` : '')
        + (woljiNote ? ' ' + woljiNote : '')
        + `<br><span style="color:var(--gold)">→ 넘치는 기운을 빼줄 <strong>식상 ${sikSangJW}(${sikSangOh})</strong> 또는 일간을 극제할 관성이 용신 후보입니다.</span>`;
    } else if (shinglevel === 'weak') {
      const tops = topPositions(weakenPositions);
      const woljiNote = woljiWeakenEntry
        ? `특히 <strong>월지에 ${woljiWeakenEntry.star}</strong>이 자리하여 일간이 받는 소모·극의 압박이 큽니다.`
        : woljiSupportEntry
        ? `월지에 <strong>${woljiSupportEntry.star}</strong>이 있어 일간을 돕지만, 전체 식재관의 무게가 더 무겁습니다.`
        : '';
      return `비겁·인성 점수 <strong>${supportScore}점</strong>으로 신약 기준(30점) 이하입니다.`
        + (tops ? ` ${tops}이 일간의 힘을 빼앗고 있습니다.` : '')
        + (woljiNote ? ' ' + woljiNote : '')
        + `<br><span style="color:var(--gold)">→ 일간을 생해줄 <strong>인성 ${inSeongJW}(${inSeongOh})</strong> 또는 비겁이 용신 후보입니다.</span>`;
    } else {
      const tops = topPositions(supportPositions);
      return `비겁·인성 점수 <strong>${supportScore}점</strong>으로 신강(55점)·신약(30점) 기준 사이입니다.`
        + (tops ? ` ${tops}이 일간을 어느 정도 지탱합니다.` : '')
        + `<br><span style="color:var(--gold)">→ 사주에서 가장 부족한 오행을 이름으로 보충해 전체 균형을 맞춥니다.</span>`;
    }
  })();

  const geokDesc = (() => {
    const g = ana.geokguk || '';
    const sl = shinglevel; // 'strong' | 'weak' | 'balanced'

    // 격국 성격 설명
    const map = {
      '정관격':'정관(正官)이 격국을 이루는 사주로, 조직·명예·원칙을 중시하는 기질이 강합니다.',
      '편관격':'편관(偏官)이 격국을 이루어 추진력과 카리스마가 두드러지는 사주입니다.',
      '정인격':'정인(正印)이 격국을 이루어 학문·지혜·모성의 기운이 풍부한 사주입니다.',
      '편인격':'편인(偏印)이 격국을 이루어 독창성과 직관력이 뛰어난 사주입니다.',
      '식신격':'식신(食神)이 격국을 이루어 온화하고 창의적인 기질을 지닌 사주입니다.',
      '상관격':'상관(傷官)이 격국을 이루어 재능과 표현력이 뛰어나지만 예민할 수 있는 사주입니다.',
      '정재격':'정재(正財)가 격국을 이루어 성실하고 안정을 추구하는 기질의 사주입니다.',
      '편재격':'편재(偏財)가 격국을 이루어 활동적이고 사업 감각이 뛰어난 사주입니다.',
      '비겁격':'비겁(比劫)이 강한 격국으로, 독립심과 자존감이 강한 사주입니다.',

              summary = `이 사주는 일간 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong>이 ${domJW}의 극(剋)을 받아 실제로 압박을 받는 구조입니다. `
                + `식상인 <strong style="color:${OHC[shielOh]}">${shielJW}(${shielOh})</strong>으로 일간의 기운을 설기(洩氣)하거나, `
                + `인성인 <strong style="color:${OHC[generatesIlOh]||'var(--mut)'}">토(토)</strong> 계열로 일간을 보강하는 방향이 합리적입니다. `
                + `이름 한자에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 담아 균형을 맞춥니다.`;
            } else if (CONTROL[ilganOh] === dominantOh) {
              // 일간이 많은 오행을 극하지 못하는 구조
              summary = `이 사주는 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong> 일간이 <strong style="color:${OHC[dominantOh]}">${domJW}(${dominantOh})</strong>을 극해야 하나, ${domJW}의 수가 많아 오히려 일간이 힘을 쏟는 구조입니다. `
                + `식상인 <strong style="color:${OHC[shielOh]}">${shielJW}(${shielOh})</strong>으로 일간의 기운을 빼거나, `
                + `인성으로 일간을 보강하는 방향이 더 효과적입니다. `
                + `이름에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 보충합니다.`;
            } else {
              summary = `이 사주는 ${shingStr}으로 일간 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong>의 기운이 강합니다. `
                + `강한 기운을 설기(洩氣)할 식상 <strong style="color:${OHC[shielOh]}">${shielJW}(${shielOh})</strong>, 또는 극제(剋制)할 `
                + `<strong style="color:${OHC[controlsIlOh]}">${controlJW}(${controlsIlOh})</strong> 오행이 균형을 잡아줍니다. `
                + `이름에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 담습니다.`;
            }
          } else {
            summary = `이 사주는 ${shingStr}으로 일간 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong>의 기운이 강합니다. `
              + `식상 <strong style="color:${OHC[shielOh]}">${shielJW}(${shielOh})</strong>으로 기운을 설기하거나, `
              + `<strong style="color:${OHC[controlsIlOh]}">${controlJW}(${controlsIlOh})</strong>으로 극제하는 방향이 필요합니다. `
              + `이름에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 보충합니다.`;
          }
        } else if (isWeak) {
          // 신약 — 일간을 생하거나 비겁으로 도와야 함
          const supportJW = OHJ[generatesIlOh] || '';
          summary = `이 사주는 ${shingStr}으로 일간 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong>의 기운이 약합니다. `
            + `일간을 생(生)하는 인성 <strong style="color:${OHC[generatesIlOh]}">${supportJW}(${generatesIlOh})</strong>, 또는 같은 오행의 비겁으로 힘을 더해주어야 합니다. `
            + `이름에 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 담아 일간을 보강합니다.`;
        } else {
          // 중화
          summary = `이 사주는 일간 <strong style="color:${OHC[ilganOh]}">${ilganJW}(${ilganOh})</strong>의 기운이 비교적 균형을 이루고 있습니다. `
            + `전체 오행의 조화를 유지하는 방향으로 이름을 짓되, 부족한 <strong style="color:${ysCol}">${yongsinJW}(${yongsinOh})</strong> 오행을 이름 한자에 담아 보완합니다.`;
        }

        if (heesinInfo) {
          summary += ` 희신(${heesinInfo})을 함께 활용하면 더욱 좋은 이름이 됩니다.`;
        }

        return summary;
      })()}
    </div>
  </div>`;

  document.getElementById('oOheng').innerHTML = d;
}

// ── 이름 생성 ──
function genNames(sung, strokes, yongsinJW, ana) {
  document.getElementById('oName').innerHTML =
    `<div class="ld"><div class="sp"></div><p>이름 조합 분석 중…</p></div>`;

  setTimeout(() => {
    // HANJA_DB + JAWO_OHAENG_DB 통합
    const pool = [];
    const seen = new Set();
    HANJA_DB.forEach(h => {
      const el = h.element==='Water'?'水':h.element;
      const k = h.char+el;
      if (!seen.has(k)) { seen.add(k); pool.push({char:h.char,korean:h.korean,strokes:h.strokes,element:el,meaning:h.meaning,gender:h.gender,hanja:h.char}); }
    });
    Object.entries(JAWO_OHAENG_DB).forEach(([el,list]) => {
      list.forEach(item => {
        const k = item.char+el;
        if (!seen.has(k)) {
          seen.add(k);
          const parts = item.kor.split(' ');
          pool.push({char:item.char,korean:parts[parts.length-1],strokes:item.stroke,element:el,meaning:item.meaning,gender:'N',hanja:item.char});
        }
      });
    });

    // 성별 필터
    const gp = pool.filter(h => h.gender===G.gender || h.gender==='N');

    // db_saju.js의 recommendNames() 사용 (희신·기신 전달)
    const heesinList = ana.yongsin.heesin || [];
    const gisinList  = ana.yongsin.gisin  || [];
    const rawResults = recommendNames(sung, strokes, yongsinJW, gp, heesinList, gisinList);

    // 한글 이름 및 eumOhaeng.details 보완
    const raw = rawResults.map(r => {
      // char1, char2 찾기 (pool에서 한자 매칭)
      const hanjaChars = r.hanjaName ? r.hanjaName.split('') : [];
      const c1 = gp.find(x => x.hanja === hanjaChars[0]);
      const c2 = gp.find(x => x.hanja === hanjaChars[1]);
      const kor1 = c1 ? c1.korean : hanjaChars[0];
      const kor2 = c2 ? c2.korean : hanjaChars[1];
      const koreanName = sung + kor1 + kor2;

      const eum = r.eumOhaeng || {};
      if (!eum.details) eum.details = []; // 혹시 모를 방어코드 유지
      if (!eum.flow)    eum.flow    = [];

      return { ...r, name: koreanName, eumOhaeng: eum };
    });

    // 점수 정렬: 수리오행 4격 점수 + 희신 포함 보너스
    const ls = {great:3,good:2,neutral:1,bad:0,terrible:-1};
    raw.sort((a,b) => {
      const sa = ['won','hyeong','i','jeong'].reduce((s,k)=>s+(ls[a.suriGeok[k].luck]||0),0)
               + (a.yongsinMatch.includes('희신') ? 2 : 0);
      const sb = ['won','hyeong','i','jeong'].reduce((s,k)=>s+(ls[b.suriGeok[k].luck]||0),0)
               + (b.yongsinMatch.includes('희신') ? 2 : 0);
      return sb-sa;
    });

    G.results = raw;
    renderNames(raw);
  }, 300);
}

// ── 이름 목록 렌더 ──
function renderNames(list) {
  const allEl = ['木','火','土','金','水'];
  let fr = `<button class="fb on" onclick="filterE(null,this)">전체 (${list.length})</button>`;
  allEl.forEach(el => {
    const cnt = list.filter(r=>r.resourceOhaeng.includes(el)).length;
    if (cnt) fr += `<button class="fb" onclick="filterE('${el}',this)">${el} ${cnt}</button>`;
  });
  document.getElementById('fr').innerHTML = fr;
  document.getElementById('si').textContent =
    list.length ? `총 ${list.length}개 · 수리오행 4격 점수순` : '';

  if (!list.length) {
    document.getElementById('oName').innerHTML =
      `<div class="emp"><span class="emc">名</span><p>조건에 맞는 이름이 없습니다.</p>
       <p style="font-size:10px;margin-top:6px;color:var(--dim)">성씨 획수를 다시 확인하거나 다른 조건으로 시도해보세요.</p></div>`;
    setStep(3); return;
  }

  let h = '<div class="ng">';
  list.slice(0,48).forEach((r,idx) => {
    const [e1,e2] = r.resourceOhaeng.split('·');
    const nameBody = r.name.slice(1); // 성 제거
    h += `<div class="nc" onclick="showDet(${idx})">
      <div class="nk">${nameBody} <span class="nh">${r.hanjaName}</span></div>
      <div class="nfull">${r.name} / ${r.hanjaName}</div>
      <div class="nbs">
        <span class="ob ob-${e1}">${e1}</span>
        <span class="ob ob-${e2}">${e2}</span>
        <span style="font-size:9px;color:var(--dim);margin-left:3px">${r.yongsinMatch}</span>
      </div>
      <div class="sr">
        ${['won','hyeong','i','jeong'].map((k,ki)=>{
          const lb=['원격','형격','이격','정격'][ki];
          const v=r.suriGeok[k];
          return `<div class="sc"><span class="scl">${lb}</span>
            <span class="scn lg-${v.luck}">${v.value}</span>
            <span class="sck lg-${v.luck}">${LKL[v.luck]||''}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  });
  h += '</div>';
  document.getElementById('oName').innerHTML = h;
  setStep(3);
}

function filterE(el, btn) {
  G.filterEl = el;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderNames(el ? G.results.filter(r=>r.resourceOhaeng.includes(el)) : G.results);
}

// ── 상세 모달 ──
function showDet(idx) {
  const list = G.filterEl ? G.results.filter(r=>r.resourceOhaeng.includes(G.filterEl)) : G.results;
  const r = list[idx]; if (!r) return;
  const [e1,e2] = r.resourceOhaeng.split('·');
  const nameBody = r.name.slice(1);
  document.getElementById('mdN').textContent = r.name;
  document.getElementById('mdH').textContent = nameBody + ' · ' + r.hanjaName;

  // 한자 정보 검색 (hanjaName의 각 한자로 조회)
  const hanjaChars = r.hanjaName ? r.hanjaName.split('') : ['',''];
  const hInfo = hanjaChars.map(c => {
    const a = HANJA_DB.find(h=>h.char===c);
    if (a) return a;
    for (const [,lst] of Object.entries(JAWO_OHAENG_DB)) {
      const x = lst.find(i=>i.char===c);
      if (x) return {char:x.char, korean:x.kor.split(' ').pop(), strokes:x.stroke, element:'', meaning:x.meaning};
    }
    return null;
  });

  // 음령오행 흐름 렌더
  const eum = r.eumOhaeng;
  let efh = '<div class="ef">';
  eum.flow.forEach((fl,i) => {
    const raw = fl.replace(/[()목화토금수]/g,'').trim() || fl;
    efh += `<div style="display:inline-flex;align-items:center;gap:4px">
      <span class="efe">${fl}</span>${i<eum.flow.length-1?'<span class="efa">→</span>':''}
    </div>`;
  });
  efh += '</div>';
  eum.details.forEach(d => {
    const ok = d.includes('상생')||d.includes('동기');
    efh += `<div class="efd" style="color:${ok?'var(--good)':'var(--bad)'}">${d}</div>`;
  });
  efh += `<div style="font-size:10px;color:var(--mut);margin-top:5px;line-height:1.5">${eum.comment}</div>`;

  document.getElementById('mdB').innerHTML = `
    <div class="ms">
      <div class="mst">한자 의미</div>
      <div class="hjg">${[0,1].map(i=>{
        const h=hInfo[i]; const el=[e1,e2][i]; const col=OHC[JWO[el]]||'var(--mut)';
        if(!h) return `<div class="hji"><div class="hjb" style="color:${col}">${hanjaChars[i]}</div><div class="hji-t"><strong>${hanjaChars[i]}</strong></div></div>`;
        const elh=h.element?`오행: <span style="color:${col}">${el}</span><br>`:'';
        return `<div class="hji">
          <div class="hjb" style="color:${col}">${h.char}</div>
          <div class="hji-t"><strong>${h.korean||''}(${h.char})</strong><br>획수: ${h.strokes}획<br>${elh}${h.meaning}</div>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="ms">
      <div class="mst">수리오행 사격 (四格)</div>
      <div class="sgg">${['won','hyeong','i','jeong'].map((k,ki)=>{
        const lbl=['원격(元格) 성+이름1','형격(亨格) 이름1+이름2','이격(利格) 성+이름2','정격(貞格) 전체'][ki];
        const v=r.suriGeok[k];
        return `<div class="sgi"><div class="sgl">${lbl}</div>
          <div class="sgn lg-${v.luck}">${v.value} <span style="font-size:12px">${LKL[v.luck]||''}</span></div>
          <div class="sgm">${v.meaning||''}</div></div>`;
      }).join('')}</div>
    </div>
    <div class="ms">
      <div class="mst">음령오행 흐름</div>
      ${efh}
    </div>`;

  document.getElementById('mbg').className = 'mbg show';
  document.body.style.overflow = 'hidden';
}

function closeMbg(e) { if(e.target===document.getElementById('mbg')) closeMd(); }
function closeMd() {
  document.getElementById('mbg').className = 'mbg hide';
  document.body.style.overflow = '';
}
function resetAll() {
  G.hour=null; G.filterEl=null; G.results=[];
  show('sInput','show'); show('sSaju','hide'); show('sName','hide');
  setStep(1);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeMd(); });
</script>
