<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 기반 작명 시스템</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/manseryok.js"></script>
<script src="js/saju-engine.js"></script>
<script src="js/naming-db.js"></script>
<script src="js/naming-engine.js"></script>
</head>
<body>
<div class="app">

  <!-- ── 헤더 ─────────────────────────────────────────── -->
  <header class="app-header">
    <div class="app-title">사주 기반 작명 시스템</div>
    <div class="app-sub">생년월일시 사주 분석 → 용신 도출 → 자원·음령·수리 종합 작명</div>
  </header>

  <!-- ── 스텝 바 ───────────────────────────────────────── -->
  <div class="step-bar">
    <button class="step-btn active" id="tab1" onclick="goTab(1)">① 사주 입력</button>
    <button class="step-btn" id="tab2" onclick="goTab(2)">② 사주 분석</button>
    <button class="step-btn" id="tab3" onclick="goTab(3)">③ 이름 추천</button>
    <button class="step-btn" id="tab4" onclick="goTab(4)">④ 상세 검수</button>
  </div>

  <!-- ════════════════════════════════════════
       PAGE 1 — 사주 입력
  ════════════════════════════════════════ -->
  <div id="page1">

    <div class="card">
      <div class="card-title">📅 생년월일시</div>
      <div class="row2">
        <div>
          <label class="label">양력 / 음력</label>
          <select id="calType">
            <option value="solar">양력 (기본)</option>
            <option value="lunar">음력 (참고용)</option>
          </select>
        </div>
        <div>
          <label class="label">성별</label>
          <select id="gender">
            <option value="M">남성</option>
            <option value="F">여성</option>
          </select>
        </div>
      </div>
      <div class="row3">
        <div>
          <label class="label">년도</label>
          <input type="number" id="year" value="1990" min="1930" max="2030">
        </div>
        <div>
          <label class="label">월</label>
          <input type="number" id="month" value="5" min="1" max="12">
        </div>
        <div>
          <label class="label">일</label>
          <input type="number" id="day" value="15" min="1" max="31">
        </div>
      </div>
      <div class="row2">
        <div>
          <label class="label">출생 시각 (0~23시, 모르면 비워두세요)</label>
          <input type="number" id="hour" value="" min="0" max="23" placeholder="시각 미상이면 공백">
        </div>
        <div></div>
      </div>
      <div id="lunarWarn" class="warn-box hidden">
        음력은 양력으로 변환 후 입력해야 절기 계산이 정확합니다.
        <a href="https://search.naver.com/search.naver?query=음력+양력+변환" target="_blank" style="color:inherit;text-decoration:underline">변환 바로가기 ↗</a>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🔤 성씨 및 이름 조건</div>
      <div class="row2">
        <div>
          <label class="label">성씨 (한글)</label>
          <input type="text" id="surname" value="김" maxlength="2" placeholder="예: 김, 남궁">
        </div>
        <div>
          <label class="label">성씨 한자 획수 <span style="color:var(--c-text3);font-size:11px">(자동 계산, 수정 가능)</span></label>
          <div class="stroke-input">
            <input type="number" id="surnameStroke" value="8" min="1" max="30">
            <span class="stroke-hint" id="strokeHint">김(金) = 8획</span>
          </div>
        </div>
      </div>
      <div class="row2">
        <div>
          <label class="label">이름 글자 수</label>
          <select id="nameLen">
            <option value="2">두 글자</option>
            <option value="1">한 글자</option>
          </select>
        </div>
        <div></div>
      </div>
      <div class="field">
        <label class="label">강조하고 싶은 운 (복수 선택)</label>
        <div class="fortune-grid" id="fortuneGrid">
          <label class="fortune-check checked"><input type="checkbox" value="재물" checked>💰 재물운</label>
          <label class="fortune-check"><input type="checkbox" value="건강">💪 건강운</label>
          <label class="fortune-check"><input type="checkbox" value="학업">📚 학업운</label>
          <label class="fortune-check"><input type="checkbox" value="명예">🏆 명예운</label>
          <label class="fortune-check"><input type="checkbox" value="인간관계">🤝 인간관계운</label>
        </div>
      </div>
    </div>

    <div class="flex-end">
      <button class="btn btn-primary" onclick="doAnalyze()">사주 분석하기 →</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PAGE 2 — 사주 분석
  ════════════════════════════════════════ -->
  <div id="page2" class="hidden">
    <div id="analyzeResult"></div>
    <div class="flex-end">
      <button class="btn" onclick="goTab(1)">← 다시 입력</button>
      <button class="btn btn-primary" onclick="doGenNames()">이름 추천받기 →</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PAGE 3 — 이름 추천
  ════════════════════════════════════════ -->
  <div id="page3" class="hidden">
    <div id="nameResult"></div>
    <div class="flex-end">
      <button class="btn" onclick="goTab(2)">← 분석으로</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       PAGE 4 — 상세 검수
  ════════════════════════════════════════ -->
  <div id="page4" class="hidden">
    <div id="detailResult"></div>
    <div class="flex-end">
      <button class="btn" onclick="goTab(3)">← 이름 목록</button>
    </div>
  </div>

</div><!-- /.app -->

<script>
// ════════════════════════════════════════════════════════════
// 전역 상태
// ════════════════════════════════════════════════════════════
let G = {
  year:1990, month:5, day:15, hour:null,
  gender:'M', calType:'solar', surname:'김', surnameStroke:8,
  nameLen:2, fortunePref:['재물'],
  sajuResult: null,
  candidates: [],
  selectedIdx: -1,
};

// ── 탭 이동 ────────────────────────────────────────────────
function goTab(n) {
  [1,2,3,4].forEach(i => {
    document.getElementById('page'+i).classList.toggle('hidden', i !== n);
    const btn = document.getElementById('tab'+i);
    btn.classList.toggle('active', i === n);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── 유틸 ───────────────────────────────────────────────────
const OH_COLOR = ['var(--c-wood)','var(--c-fire)','var(--c-earth)','var(--c-metal)','var(--c-water)'];
const OH_BG    = ['var(--c-wood-bg)','var(--c-fire-bg)','var(--c-earth-bg)','var(--c-metal-bg)','var(--c-water-bg)'];
const OH_TEXT  = ['var(--c-wood-t)','var(--c-fire-t)','var(--c-earth-t)','var(--c-metal-t)','var(--c-water-t)'];
const OH_PILL  = ['pill-wood','pill-fire','pill-earth','pill-metal','pill-water'];
const OH_NAMES = ['목','화','토','금','수'];
const OH_HJ    = ['木','火','土','金','水'];
const LUCK_LABEL = {great:'대길',good:'길',neutral:'평',bad:'흉',terrible:'대흉'};
const LUCK_CLS   = {great:'badge-great',good:'badge-good',neutral:'badge-neutral',bad:'badge-bad',terrible:'badge-terrible'};
const LUCK_COLOR = {great:'var(--c-wood-t)',good:'var(--c-water-t)',neutral:'var(--c-metal-t)',bad:'var(--c-fire-t)',terrible:'#a32d2d'};
const SHINGANG_LABEL = {strong:'신강(身强) — 일간이 강합니다',weak:'신약(身弱) — 일간이 약합니다',neutral:'중화(中和) — 균형 잡힌 사주'};

function ohPill(idx, text) {
  return `<span class="pill ${OH_PILL[idx]}">${text}</span>`;
}
function luckBadge(luck) {
  return `<span class="badge ${LUCK_CLS[luck]}">${LUCK_LABEL[luck]}</span>`;
}

// ── 초기 이벤트 ────────────────────────────────────────────
document.getElementById('calType').addEventListener('change', e => {
  document.getElementById('lunarWarn').classList.toggle('hidden', e.target.value !== 'lunar');
});

// 성씨 자동 획수 계산
document.getElementById('surname').addEventListener('input', e => {
  const s = e.target.value.trim();
  if (!s) return;
  const stroke = getSurnameStroke(s);
  document.getElementById('surnameStroke').value = stroke;
  document.getElementById('strokeHint').textContent = `자동 계산: ${stroke}획 (수정 가능)`;
});

// 운 체크박스 토글
document.querySelectorAll('.fortune-check').forEach(label => {
  label.addEventListener('click', () => {
    label.classList.toggle('checked', label.querySelector('input').checked);
  });
});

// ════════════════════════════════════════════════════════════
// STEP 1 → 사주 분석
// ════════════════════════════════════════════════════════════
function doAnalyze() {
  G.year   = parseInt(document.getElementById('year').value)  || 1990;
  G.month  = parseInt(document.getElementById('month').value) || 5;
  G.day    = parseInt(document.getElementById('day').value)   || 15;
  const hv = document.getElementById('hour').value.trim();
  G.hour   = hv === '' ? null : parseInt(hv);
  G.gender = document.getElementById('gender').value;
  G.calType= document.getElementById('calType').value;
  G.surname= document.getElementById('surname').value.trim() || '김';
  G.surnameStroke = parseInt(document.getElementById('surnameStroke').value) || getSurnameStroke(G.surname);
  G.nameLen= parseInt(document.getElementById('nameLen').value);
  G.fortunePref = Array.from(document.querySelectorAll('#fortuneGrid input:checked')).map(el => el.value);

  // 유효성 검사
  if (G.month < 1 || G.month > 12 || G.day < 1 || G.day > 31) {
    alert('날짜를 올바르게 입력해주세요.'); return;
  }

  try {
    G.sajuResult = SajuEngine.analyze(G.year, G.month, G.day, G.hour, G.gender);
  } catch(e) {
    alert('사주 계산 오류: ' + e.message); return;
  }

  renderAnalyze();
  goTab(2);
}

function renderAnalyze() {
  const R = G.sajuResult;
  const { yeonju, wolju, ilju, siju, dist, shingang, geokguk, yongsin, daeun, hapchung, sinsal, ilganDesc } = R;
  const total = dist.reduce((a,b)=>a+b,0) || 1;

  // 4주 기둥
  const pillarHTML = (p, label) => p ? `
    <div class="saju-pillar">
      <div class="pillar-label">${label}</div>
      <div class="pillar-gan" style="color:${OH_COLOR[Manseryok.STEM_OHENG_IDX[p.stemIdx]]}">${p.ganHJ}</div>
      <div class="pillar-ji"  style="color:${OH_COLOR[Manseryok.BRANCH_OHENG_IDX[p.branchIdx]]}">${p.jiHJ}</div>
      <div class="pillar-kor">${p.gan}${p.ji}</div>
    </div>` : `
    <div class="saju-pillar">
      <div class="pillar-label">시주 時柱</div>
      <div class="pillar-kor" style="margin-top:20px">미상</div>
    </div>`;

  // 오행 바
  const ohBarHTML = OH_NAMES.map((nm, i) => `
    <div class="oheng-item">
      <div class="oheng-num" style="color:${OH_COLOR[i]}">${dist[i]}</div>
      <div class="oheng-track"><div class="oheng-fill" style="width:${Math.round(dist[i]/total*100)}%;background:${OH_COLOR[i]}"></div></div>
      <div class="oheng-name">${OH_HJ[i]}(${nm})</div>
    </div>`).join('');

  // 용신·희신·기신 pill
  const yongPills = yongsin.yongsin.map(y => ohPill(y.idx, `용신 ${y.hj}(${y.name})`)).join('');
  const heePills  = yongsin.heesin.map(y  => ohPill(y.idx, `희신 ${y.hj}(${y.name})`)).join('');
  const giPills   = yongsin.gisin.map(y   => ohPill(y.idx, `기신 ${y.hj}(${y.name})`)).join('');

  // 대운
  const daeunHTML = daeun.runs.map(d => `
    <div class="daeun-item">
      <div class="daeun-age">${d.age}세~</div>
      <div class="daeun-gan" style="color:${OH_COLOR[Manseryok.STEM_OHENG_IDX[d.stemIdx]]}">${d.ganHJ}</div>
      <div class="daeun-ji"  style="color:${OH_COLOR[Manseryok.BRANCH_OHENG_IDX[d.branchIdx]]}">${d.jiHJ}</div>
    </div>`).join('');

  // 합·충
  const hapStr  = hapchung.cheonganHap.map(h=>`<span class="pill pill-wood">${h.name} (${h.pos})</span>`).join('')
    + hapchung.jijihap.map(h=>`<span class="pill pill-fire">${h.name}</span>`).join('')
    + hapchung.chung.map(h=>`<span class="pill pill-metal">${h.name} (${h.pos})</span>`).join('');

  // 신살
  const sinsalHTML = sinsal.length ? sinsal.map(s => `
    <div class="sinsal-item">
      <div class="sinsal-name">${s.name} <span style="font-size:11px;color:var(--c-text3)">${s.pos}</span></div>
      <div class="sinsal-desc">${s.desc}</div>
    </div>`).join('') : '<span style="color:var(--c-text3);font-size:13px">주요 신살 없음</span>';

  // 운별 강화 포인트
  const fortuneMap = {
    재물: '편재(偏財)·정재(正財) 기운을 이름에 담으세요. 용신 방향의 수(水)·금(金) 한자가 재물운을 보강합니다.',
    건강: '인성(印星) 오행이 강해지면 체력과 면역이 올라갑니다. 용신 오행과 일치하는 한자를 우선 선택하세요.',
    학업: '수(水)·금(金) 기운이 지혜와 학업운을 담당합니다. 음령오행에 수(水) 기운의 초성(ㅁ·ㅂ·ㅍ)을 반영하세요.',
    명예: '관성(官星) 오행 방향의 한자가 명예·사회적 지위를 높입니다. 수리 정격 길수를 최우선으로 고르세요.',
    인간관계: '목(木)·토(土) 기운이 인덕(人德)과 인간관계를 넓힙니다. 뜻이 따뜻하고 포용적인 한자를 선택하세요.',
  };
  const fortuneHTML = G.fortunePref.length ? G.fortunePref.map(f => `
    <div class="arow">
      <div class="arow-icon" style="background:var(--c-fire-bg);color:var(--c-fire-t)">⭐</div>
      <div><div class="arow-label">${f}운 강화 포인트</div><div class="arow-desc">${fortuneMap[f]||''}</div></div>
    </div>`).join('') : '';

  document.getElementById('analyzeResult').innerHTML = `

    <div class="card">
      <div class="card-title">🀄 사주원국 (四柱原局)</div>
      <div class="saju-grid">
        ${pillarHTML(yeonju,'연주 年柱')}
        ${pillarHTML(wolju, '월주 月柱')}
        ${pillarHTML(ilju,  '일주 日柱')}
        ${pillarHTML(siju,  '시주 時柱')}
      </div>
      <div style="font-size:12px;color:var(--c-text3);margin-top:4px">
        일간(日干): <strong>${ilju.ganHJ}(${ilju.gan})</strong> — ${ilganDesc.name||''} / 격국: <strong>${geokguk}</strong>
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚖️ 오행 분포</div>
      <div class="oheng-bar">${ohBarHTML}</div>
      <div class="arow" style="margin-top:8px">
        <div class="arow-icon" style="background:var(--c-bg2)">📊</div>
        <div><div class="arow-label">신강신약 판단</div><div class="arow-val">${SHINGANG_LABEL[shingang]}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎯 용신·희신·기신 (이름 작명 기준)</div>
      <div class="arow">
        <div class="arow-icon" style="background:${OH_BG[yongsin.yongsin[0]?.idx??0]};color:${OH_TEXT[yongsin.yongsin[0]?.idx??0]}">↑</div>
        <div>
          <div class="arow-label">용신(用神) — 이름에 반드시 담아야 할 오행</div>
          <div class="arow-val">${yongPills}</div>
          <div class="arow-desc">사주에 가장 필요한 오행으로, 자원·음령·수리 모두 이 기운을 중심으로 작명합니다.</div>
        </div>
      </div>
      <div class="arow">
        <div class="arow-icon" style="background:var(--c-bg2)">↗</div>
        <div>
          <div class="arow-label">희신(喜神) — 용신을 돕는 보조 오행</div>
          <div class="arow-val">${heePills}</div>
        </div>
      </div>
      <div class="arow">
        <div class="arow-icon" style="background:var(--c-fire-bg);color:var(--c-fire-t)">↓</div>
        <div>
          <div class="arow-label">기신(忌神) — 이름에 피해야 할 오행</div>
          <div class="arow-val">${giPills}</div>
        </div>
      </div>
    </div>

    ${ilganDesc.personality ? `
    <div class="card">
      <div class="card-title">🧬 일간 성격 분석 (${ilganDesc.name})</div>
      <div class="arow">
        <div class="arow-icon" style="background:var(--c-bg2)">${ilganDesc.symbol?.'[0]'||'🌿'}</div>
        <div>
          <div class="arow-desc" style="font-size:13px">${ilganDesc.personality}</div>
          <div style="margin-top:6px">
            <span class="pill pill-wood">강점: ${ilganDesc.strength}</span>
            <span class="pill pill-fire">약점: ${ilganDesc.weakness}</span>
          </div>
        </div>
      </div>
    </div>` : ''}

    ${G.fortunePref.length ? `
    <div class="card">
      <div class="card-title">⭐ 강조 운 작명 포인트</div>
      ${fortuneHTML}
    </div>` : ''}

    ${hapStr ? `
    <div class="card">
      <div class="card-title">🔗 합충(合沖) 관계</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${hapStr}</div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">🌟 신살(神殺)</div>
      <div class="sinsal-list">${sinsalHTML}</div>
    </div>

    <div class="card">
      <div class="card-title">📅 대운(大運) <span style="font-size:12px;font-weight:400;color:var(--c-text3)">${daeun.forward?'순행':'역행'} · ${daeun.startAge}세 시작</span></div>
      <div class="daeun-strip">${daeunHTML}</div>
    </div>
  `;
}

// ════════════════════════════════════════════════════════════
// STEP 2 → 이름 추천
// ════════════════════════════════════════════════════════════
function doGenNames() {
  if (!G.sajuResult) return;
  document.getElementById('nameResult').innerHTML =
    '<div class="loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div> 이름 조합 생성 중...</div>';
  goTab(3);
  setTimeout(renderNames, 80);
}

function renderNames() {
  try {
    G.candidates = NamingEngine.generateNames(
      G.sajuResult, G.surname, G.nameLen, G.gender, G.fortunePref
    );
  } catch(e) {
    document.getElementById('nameResult').innerHTML =
      `<div class="error-box">이름 생성 오류: ${e.message}</div>`; return;
  }

  if (!G.candidates.length) {
    document.getElementById('nameResult').innerHTML =
      '<div class="warn-box">조건에 맞는 이름 조합을 찾지 못했습니다. 성씨 획수나 조건을 바꿔보세요.</div>';
    return;
  }

  const yong = G.sajuResult.yongsin.yongsin[0];

  const cards = G.candidates.map((c, idx) => {
    const pct = Math.round(c.total / c.maxScore * 100);
    const clampPct = Math.min(pct, 99);
    const labelCls = clampPct >= 75 ? 'badge-great' : clampPct >= 55 ? 'badge-good' : 'badge-neutral';
    const labelTxt = clampPct >= 75 ? '추천' : '양호';
    const nameHanja = c.h1.char + (c.h2 ? c.h2.char : '');
    const nameKor   = c.h1.kor  + (c.h2 ? c.h2.kor  : '');

    const geokItems = [
      {k:'won',l:'원격',d:'초년'},
      {k:'hyeong',l:'형격',d:'청년'},
      {k:'i',l:'이격',d:'장년'},
      {k:'jeong',l:'정격',d:'총운'},
    ].map(g => {
      const n = c.geok[g.k];
      const luck = SURI_DB[n]?.luck;
      return `<div class="geok-item">
        <div class="geok-label">${g.l} ${g.d}</div>
        <div class="geok-num" style="color:${LUCK_COLOR[luck]}">${n}수 ${LUCK_LABEL[luck]}</div>
      </div>`;
    }).join('');

    return `
    <div class="name-card" id="nc${idx}" onclick="selectName(${idx})">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div>
          <span class="name-title">${G.surname}${nameHanja}</span>
          <span class="name-kor">${G.surname}${nameKor}</span>
        </div>
        <span class="badge ${labelCls}">${labelTxt} ${clampPct}점</span>
      </div>
      <div class="name-mean">${c.h1.meaning}${c.h2 ? ' · ' + c.h2.meaning : ''}</div>
      <div class="tag-row">
        ${ohPill(c.h1.oh, `자원 ${OH_HJ[c.h1.oh]}`)}
        ${c.h2 ? ohPill(c.h2.oh, `자원 ${OH_HJ[c.h2.oh]}`) : ''}
        ${ohPill(c.eumOh1, `음령 ${OH_HJ[c.eumOh1]}`)}
        ${c.eumOh2 !== null ? ohPill(c.eumOh2, `음령 ${OH_HJ[c.eumOh2]}`) : ''}
      </div>
      <div class="geok-row">${geokItems}</div>
    </div>`;
  }).join('');

  document.getElementById('nameResult').innerHTML = `
    <div class="info-box">
      용신 <strong>${OH_HJ[yong.idx]}(${yong.name})</strong> 기준 — 자원오행·음령오행·수리성명학 종합 추천 이름입니다.<br>
      이름을 클릭하면 상세 검수 결과를 확인할 수 있습니다.
    </div>
    ${cards}
  `;
}

// ════════════════════════════════════════════════════════════
// STEP 3 → 상세 검수
// ════════════════════════════════════════════════════════════
function selectName(idx) {
  G.selectedIdx = idx;
  document.querySelectorAll('.name-card').forEach((el, i) =>
    el.classList.toggle('selected', i === idx)
  );
  renderDetail(G.candidates[idx]);
  goTab(4);
}

function renderDetail(c) {
  const checks = NamingEngine.inspectName(c, G.sajuResult, G.surname);
  const nameHanja = c.h1.char + (c.h2 ? c.h2.char : '');
  const nameKor   = c.h1.kor  + (c.h2 ? c.h2.kor  : '');
  const surnameEumOh = getEumOh(G.surname[G.surname.length - 1]);

  const allOk    = checks.every(ck => !ck.warn);
  const hasWarn  = checks.some(ck => ck.warn && !SURI_DB[c.geok?.jeong]?.luck?.includes('terrible'));
  const hasBad   = checks.some(ck => ck.warn);

  const statusBox = allOk
    ? `<div class="info-box">✅ 모든 항목이 양호합니다. 우수한 이름입니다.</div>`
    : hasBad
    ? `<div class="warn-box">⚠️ 일부 항목을 확인하세요. 아래 세부 내용을 검토해 주세요.</div>`
    : `<div class="info-box">대체로 양호합니다.</div>`;

  const checkHTML = checks.map(ck => {
    const cls = ck.ok ? 'dot-ok' : ck.warn ? 'dot-bad' : 'dot-warn';
    const icon = ck.ok ? '✓' : ck.warn ? '✕' : '△';
    return `
    <div class="check-item">
      <div class="check-dot ${cls}">${icon}</div>
      <div>
        <div class="check-label">${ck.label} ${ck.luck ? luckBadge(ck.luck) : ''}</div>
        <div class="check-desc">${ck.desc}</div>
      </div>
    </div>`;
  }).join('');

  // 수리 4격 상세
  const geokDetail = [
    {k:'won',  label:'원격(元格)', desc:'초년·청소년 운세'},
    {k:'hyeong',label:'형격(亨格)',desc:'청년·중년 운세'},
    {k:'i',    label:'이격(利格)', desc:'장년 운세'},
    {k:'jeong',label:'정격(貞格)', desc:'총운 및 말년'},
  ].map(g => {
    const n = c.geok[g.k];
    const info = SURI_DB[n] || {};
    return `
    <div style="padding:10px;border:0.5px solid var(--c-border);border-radius:var(--r-md)">
      <div style="font-size:11px;color:var(--c-text3)">${g.label}</div>
      <div style="font-size:11px;color:var(--c-text3);margin-bottom:6px">${g.desc}</div>
      <div style="font-size:20px;font-weight:500;color:${LUCK_COLOR[info.luck]}">${n}수</div>
      <div style="margin:4px 0">${luckBadge(info.luck)}</div>
      <div style="font-size:12px;color:var(--c-text2);margin-top:4px">${info.meaning||''}</div>
    </div>`;
  }).join('');

  // 음령 흐름
  const eumFlow = [
    {label: G.surname, oh: surnameEumOh, note: '성씨'},
    {label: c.h1.char, oh: c.eumOh1,    note: c.h1.kor},
    ...(c.h2 ? [{label: c.h2.char, oh: c.eumOh2, note: c.h2.kor}] : []),
  ].map((item, i, arr) => {
    const arrow = i < arr.length - 1 ? `<span style="color:var(--c-text3);font-size:20px;align-self:center">→</span>` : '';
    const isGil = i > 0 && NamingEngine.isGil(arr[i-1].oh, item.oh);
    const isKe  = i > 0 && NamingEngine.isShangke(arr[i-1].oh, item.oh);
    const flowNote = i > 0 ? (isGil ? '✓' : isKe ? '상극' : '') : '';
    const flowColor = i > 0 ? (isGil ? 'var(--c-wood-t)' : isKe ? 'var(--c-fire-t)' : 'var(--c-text3)') : '';
    return `
    <div style="text-align:center">
      <div style="font-size:11px;color:var(--c-text3)">${item.note}</div>
      <span class="pill ${OH_PILL[item.oh]}">${item.label} ${OH_HJ[item.oh]}</span>
      ${flowNote ? `<div style="font-size:11px;color:${flowColor};margin-top:2px">${flowNote}</div>` : ''}
    </div>
    ${arrow}`;
  }).join('');

  // 종합 점수
  const pct = Math.min(Math.round(c.total / c.maxScore * 100), 99);
  const scoreColor = pct >= 75 ? 'var(--c-wood-t)' : pct >= 55 ? 'var(--c-water-t)' : 'var(--c-metal-t)';

  document.getElementById('detailResult').innerHTML = `

    <div class="card">
      <div style="text-align:center;padding:1rem 0">
        <div style="font-size:13px;color:var(--c-text3);margin-bottom:8px">선택한 이름</div>
        <div style="font-size:36px;font-weight:500;letter-spacing:6px">${G.surname}${nameHanja}</div>
        <div style="font-size:18px;color:var(--c-text2);margin-top:4px">${G.surname}${nameKor}</div>
        <div style="font-size:13px;color:var(--c-text3);margin-top:8px">${c.h1.meaning}${c.h2 ? ' · ' + c.h2.meaning : ''}</div>
      </div>
      <div class="score-ring">
        <div class="score-big" style="color:${scoreColor}">${pct}</div>
        <div class="score-label">종합 점수 / 100</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">✅ 작명 검수 결과</div>
      ${statusBox}
      ${checkHTML}
    </div>

    <div class="card">
      <div class="card-title">🔢 수리성명학 4격 상세</div>
      <div style="font-size:12px;color:var(--c-text3);margin-bottom:10px">
        성씨 획수 ${G.surnameStroke}획 + ${c.h1.char}(${c.h1.stroke}획)${c.h2 ? ' + ' + c.h2.char + '(' + c.h2.stroke + '획)' : ''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${geokDetail}</div>
    </div>

    <div class="card">
      <div class="card-title">🌊 음령오행(音靈五行) 흐름</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">${eumFlow}</div>
      <div style="font-size:12px;color:var(--c-text3);margin-top:10px">
        상생(相生) 또는 동기(同氣) 흐름이면 이름의 기운이 자연스럽게 이어집니다.
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎯 자원오행(字源五行) 분석</div>
      <div class="arow">
        <div class="arow-icon" style="background:${OH_BG[c.h1.oh]};color:${OH_TEXT[c.h1.oh]}">${OH_HJ[c.h1.oh]}</div>
        <div>
          <div class="arow-label">${c.h1.char} (${c.h1.kor}, ${c.h1.stroke}획)</div>
          <div class="arow-val">${c.h1.meaning}</div>
          <div class="arow-desc">자원오행: ${OH_HJ[c.h1.oh]}(${OH_NAMES[c.h1.oh]})</div>
        </div>
      </div>
      ${c.h2 ? `
      <div class="arow">
        <div class="arow-icon" style="background:${OH_BG[c.h2.oh]};color:${OH_TEXT[c.h2.oh]}">${OH_HJ[c.h2.oh]}</div>
        <div>
          <div class="arow-label">${c.h2.char} (${c.h2.kor}, ${c.h2.stroke}획)</div>
          <div class="arow-val">${c.h2.meaning}</div>
          <div class="arow-desc">자원오행: ${OH_HJ[c.h2.oh]}(${OH_NAMES[c.h2.oh]})</div>
        </div>
      </div>` : ''}
    </div>

    <div class="card" style="background:var(--c-bg2)">
      <div class="card-title">📌 작명 원리 요약</div>
      <div style="font-size:13px;color:var(--c-text2);line-height:1.8">
        <strong>용신:</strong> ${G.sajuResult.yongsin.yongsin.map(y=>OH_HJ[y.idx]+'('+y.name+')').join('·')} &nbsp;|&nbsp;
        <strong>격국:</strong> ${G.sajuResult.geokguk} &nbsp;|&nbsp;
        <strong>신강신약:</strong> ${SHINGANG_LABEL[G.sajuResult.shingang]}<br>
        <span style="color:var(--c-text3)">
          이 이름은 사주에 부족한 오행을 자원오행·음령오행·수리성명학 세 가지 방식으로 보완하여 선택되었습니다.
        </span>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
